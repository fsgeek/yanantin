[project]
name = "yanantin"
version = "0.1.0"
description = "Complementary duality between human and AI — composable tensor infrastructure"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opentimestamps>=0.4.5",
    "pydantic>=2.0",
    "httpx>=0.27",
    "duckdb>=1.4.4",
    "python-arango>=8.2.6",
    "flask>=3.1.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "dask>=2026.1.2",
    "polars>=1.38.1",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "prometheus-client>=0.24.1",
    "anthropic>=0.84.0",
    "desk>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dropbox = [
    "dropbox>=12.0",
]
receipts = [
    "willay @ {root:uri}/../willay",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/yanantin"]

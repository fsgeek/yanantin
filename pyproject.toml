[project]
name = "yanantin"
version = "0.1.2"
description = "Complementary duality between human and AI — composable tensor infrastructure"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tiksi>=0.1.0",
    "opentimestamps>=0.4.5",
    "pydantic>=2.0",
    "httpx>=0.27",
    "duckdb>=1.4.4",
    "python-arango>=8.2.6",
    "flask>=3.1.3",
    "numpy>=2.4.2",
    "anthropic>=0.84.0",
    "docker>=7.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dropbox = [
    "dropbox>=12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "integration: test hits a live external API (OpenRouter); skip with -m 'not integration'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/yanantin"]

[tool.uv.sources]
tiksi = { path = "../tiksi", editable = true }

[tool.hatch.build.targets.sdist]
include = [
    "src/yanantin",
    "tests",
    "docs/principles.md",
    "docs/stability.md",
    "docs/glossary.md",
    "docs/apacheta.md",
    "docs/blueprint.md",
    "examples",
    "conftest.py",
    "pyproject.toml",
    "README.md",
]

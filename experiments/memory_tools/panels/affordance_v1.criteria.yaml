panel_id: affordance_v1
rationale: >
  Type-II / request_capability experiment panel. Chosen to span the
  behavioral clusters the cue-conflict line identified, because the
  hypothesis is cluster-specific: does offering + cultivating
  request_capability convert a model's missing-affordance failure mode into
  an explicit gap declaration? Includes the capability-fabrication exemplar
  (mistral-small-3.2 — the model whose invented incapability motivated this
  whole question), the terse-skip cluster (qwen3-32b, gpt-oss-20b), the
  name-affordance-veto cluster (gemini-flash-lite), the silent-refuse
  cluster (llama-4-scout), and intent-dominant / no-veto controls
  (claude-haiku, gemma-4-31b, deepseek-v4-flash). All verified tool-capable
  on OpenRouter in prior runs (run_001..run_012).
context_length_min: 8000
exclude_patterns:
  - "*-audio-*"
  - "*:online"
candidates:
  - {id: "mistralai/mistral-small-3.2-24b-instruct", family: mistral, size_tier: mid, cost_tier: cheap}        # capability-fabrication exemplar
  - {id: "qwen/qwen3-32b",                           family: qwen,    size_tier: mid, cost_tier: cheap}        # terse-skip
  - {id: "openai/gpt-oss-20b",                       family: gpt-oss, size_tier: mid, cost_tier: cheap}        # terse-skip
  - {id: "google/gemini-2.5-flash-lite",             family: google-flash-lite, size_tier: small, cost_tier: frontier-cheap}  # name-affordance veto
  - {id: "meta-llama/llama-4-scout",                 family: llama,   size_tier: large-open, cost_tier: cheap} # silent-refuse
  - {id: "anthropic/claude-haiku-4.5",               family: anthropic-haiku, size_tier: small, cost_tier: frontier-cheap}     # intent-dominant
  - {id: "google/gemma-4-31b-it",                    family: gemma,   size_tier: mid, cost_tier: cheap}        # no-veto control
  - {id: "deepseek/deepseek-v4-flash",               family: deepseek, size_tier: mid, cost_tier: frontier-cheap}              # no-veto control

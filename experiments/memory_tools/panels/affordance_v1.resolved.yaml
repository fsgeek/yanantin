panel_id: affordance_v1
rationale: "Type-II / request_capability experiment panel. Chosen to span the behavioral\
  \ clusters the cue-conflict line identified, because the hypothesis is cluster-specific:\
  \ does offering + cultivating request_capability convert a model's missing-affordance\
  \ failure mode into an explicit gap declaration? Includes the capability-fabrication\
  \ exemplar (mistral-small-3.2 \u2014 the model whose invented incapability motivated\
  \ this whole question), the terse-skip cluster (qwen3-32b, gpt-oss-20b), the name-affordance-veto\
  \ cluster (gemini-flash-lite), the silent-refuse cluster (llama-4-scout), and intent-dominant\
  \ / no-veto controls (claude-haiku, gemma-4-31b, deepseek-v4-flash). All verified\
  \ tool-capable on OpenRouter in prior runs (run_001..run_012).\n"

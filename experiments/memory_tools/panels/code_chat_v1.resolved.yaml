panel_id: code_chat_v1
rationale: 'Matched code/chat sibling pairs to test whether code (and agentic) post-
  training suppresses the destructive-substring veto found in Finding 10/11. The Finding
  11 confound is that same-lab siblings diverge anyway, so a code-tuning claim requires
  the direction (code shows less veto than its chat sibling) to replicate across independent
  labs and matched sizes. Two primary matched pairs carry the confirmatory weight:
  Mistral 24B (codestral-2508 vs the strongest-veto chat anchor mistral-small-3.2)
  and Qwen 30b-a3b (qwen3-coder vs qwen3-30b-a3b-instruct-2507, identical MoE architecture,
  only post-training differs). devstral-small adds an agentic/tool-tuned arm (exploratory,
  no predicted direction). An older Qwen2.5 pair adds a looser cross-generation replication.

  '

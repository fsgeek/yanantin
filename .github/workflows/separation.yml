name: Builder/Tester Separation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

jobs:
  check-separation:
    name: Verify builder/tester separation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check no commit mixes src/ and tests/
        run: |
          FAILED=0

          # For PRs, check commits in the PR. For pushes, check the pushed commits.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # For push events, check commits in the push
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          # Skip if this is the initial push (no before SHA)
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push — skipping separation check."
            exit 0
          fi

          for COMMIT in $(git rev-list "$BASE".."$HEAD"); do
            AUTHOR=$(git log -1 --format='%ae' "$COMMIT")
            FILES=$(git diff-tree --no-commit-id --name-only -r "$COMMIT")

            TOUCHES_SRC=$(echo "$FILES" | grep -c '^src/' || true)
            TOUCHES_TESTS=$(echo "$FILES" | grep -c '^tests/' || true)

            if [ "$TOUCHES_SRC" -gt 0 ] && [ "$TOUCHES_TESTS" -gt 0 ]; then
              SHORT=$(git rev-parse --short "$COMMIT")
              echo "::error::Commit $SHORT ($AUTHOR) modifies both src/ and tests/ — violates builder/tester separation"
              echo "  Source files:"
              echo "$FILES" | grep '^src/' | sed 's/^/    /'
              echo "  Test files:"
              echo "$FILES" | grep '^tests/' | sed 's/^/    /'
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Builder/tester separation requires that code and tests be authored"
            echo "in separate commits by different agents. A builder who can change"
            echo "tests to match broken code will do so."
            exit 1
          fi

          echo "All commits respect builder/tester separation."

  tests:
    name: Run tests
    runs-on: ubuntu-latest

    # The suite is no-mock-databases by design (feedback-no-mock-databases): the
    # integration tests hit a live ArangoDB at localhost:8529 with test-tier
    # creds from ~/.yanantin/config/db.ini. CI must therefore provide a real DB,
    # not skip the DB path — a green that skipped integration would be a lie
    # about what's verified. So: an ArangoDB service container + a provisioning
    # step that creates the apacheta_test database/user and writes db.ini.
    services:
      arangodb:
        image: arangodb:3.12
        ports:
          - 8529:8529
        env:
          ARANGO_ROOT_PASSWORD: ci-root-pw
        options: >-
          --health-cmd "arangosh --server.authentication true
            --server.password ci-root-pw --javascript.execute-string 'true'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Provision apacheta_test DB/user + write db.ini
        env:
          ARANGO_ROOT_PASSWORD: ci-root-pw
        run: |
          # Create the test database and the apacheta_test user (the test tier),
          # granting it on apacheta_test. Use the HTTP API via curl so we don't
          # depend on arangosh being on the runner.
          ROOT_AUTH="root:${ARANGO_ROOT_PASSWORD}"
          TEST_PW="ci-test-pw"

          # database
          curl -fsS -u "$ROOT_AUTH" -X POST http://localhost:8529/_api/database \
            -d '{"name":"apacheta_test"}'
          # user
          curl -fsS -u "$ROOT_AUTH" -X POST http://localhost:8529/_api/user \
            -d "{\"user\":\"apacheta_test\",\"passwd\":\"${TEST_PW}\"}"
          # grant the user rw on the test database
          curl -fsS -u "$ROOT_AUTH" -X PUT \
            http://localhost:8529/_api/user/apacheta_test/database/apacheta_test \
            -d '{"grant":"rw"}'

          # db.ini the three-tier config reads (host localhost; admin=root,
          # test=apacheta_test). app tier points at apacheta — unused in CI but
          # the config expects the keys present. printf, not a heredoc: an
          # indented heredoc body inside a YAML run: block carries leading spaces
          # into the file and the indented delimiter is not recognized.
          mkdir -p "$HOME/.yanantin/config"
          printf '%s\n' \
            '[database]' \
            'database = apacheta' \
            'host = localhost' \
            'port = 8529' \
            'ssl = false' \
            'admin_user = root' \
            "admin_passwd = ${ARANGO_ROOT_PASSWORD}" \
            'app_user = apacheta_app' \
            "app_password = ${TEST_PW}" \
            'test_user = apacheta_test' \
            "test_password = ${TEST_PW}" \
            > "$HOME/.yanantin/config/db.ini"
          chmod 600 "$HOME/.yanantin/config/db.ini"

      - name: Run tests
        run: uv run pytest tests/ -v

  # Tinkuy governance job retired with the yanantin -> library pivot.
  # The succession protocol + orphan-tensor check was load-bearing when
  # yanantin's primary artifact was the cairn (an experimental package
  # with a heartbeat). It is not load-bearing for the library. Systems
  # built on top of the library can add their own tracking when they
  # need it. The tinkuy CLI is still in-tree for anyone who wants the
  # old housekeeping locally; it is no longer a CI gate.
